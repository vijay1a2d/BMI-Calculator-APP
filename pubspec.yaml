name: bmi_plus
description: "BMI+ — Smart Health & Fitness Analyzer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local persistent storage (theme, profile, BMI history)
  shared_preferences: ^2.5.5

  # Real progress charts using actual saved data
  fl_chart: ^1.2.0

  # Date/time formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
